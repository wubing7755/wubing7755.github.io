    <script>
        (function () {
            var theme = 'light';
            try {
                theme = localStorage.getItem('portfolio-theme')
                    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            } catch (e) {
                theme = 'light';
            }
            var normalizedTheme = theme === 'dark' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', normalizedTheme);
            // 站点级主题覆盖预应用：读缓存并注入 <html> 内联 style（防覆盖闪烁）；值消毒兜底。
            try {
                var overrides = localStorage.getItem('portfolio-theme-overrides');
                if (overrides) {
                    var lines = overrides.split('\n');
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (!line || line.charAt(0) === '#') continue;
                        var colon = line.indexOf(':');
                        if (colon < 0) continue;
                        var name = line.slice(0, colon).trim();
                        var value = line.slice(colon + 1).trim();
                        if (value.charAt(value.length - 1) === ';') value = value.slice(0, -1).trim();
                        var lower = value.toLowerCase();
                        if (name.indexOf('--') !== 0 || lower.indexOf('url(') !== -1 || lower.indexOf('expression(') !== -1
                            || lower.indexOf('@') !== -1 || lower.indexOf('!important') !== -1) continue;
                        document.documentElement.style.setProperty(name, value);
                    }
                }
            } catch (e) { /* 忽略：无缓存或存储不可用 */ }
            document.addEventListener('DOMContentLoaded', function () {
                var themeColor = document.querySelector('meta[name="theme-color"]');
                if (themeColor) {
                    themeColor.setAttribute('content', normalizedTheme === 'dark' ? '#101722' : '#1a5fb4');
                }
            }, { once: true });
        }());
    </script>

    <!-- 无 .razor.css 时 scoped bundle 不生成；如未来新增组件级 scoped css，恢复 PersonalPortfolio.styles.css 引用 -->
    <style>
        /* ===== WASM 加载页：像素机械头变身动画（纯 CSS，零第三方库，NFR-008） ===== */
        .loader-scene {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            font-family: "Consolas", "Microsoft YaHei", monospace;
            color: #2d3a4a;
            text-align: center;
        }

        html[data-theme="dark"] .loader-scene {
            color: #dce6f2;
            background: #101722;
        }

        .ms-frame {
            position: relative;
            width: 200px;
            height: 190px;
        }

        /* V 型天线（变身：从收起翻转到竖起） */
        .ms-fin {
            position: absolute;
            top: 6px;
            width: 14px;
            height: 58px;
            background: #e6a817;
            z-index: 3;
        }

        .ms-fin-l {
            left: 74px;
            transform-origin: 50% 100%;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            animation: ms-fin-l 4s ease-in-out infinite;
        }

        .ms-fin-r {
            right: 74px;
            transform-origin: 50% 100%;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            animation: ms-fin-r 4s ease-in-out infinite;
        }

        /* 头部主体（变身：窄方块纵向展开） */
        .ms-head {
            position: absolute;
            left: 50%;
            top: 44px;
            width: 96px;
            height: 76px;
            transform: translateX(-50%);
            background: #1a5fb4;
            border: 3px solid #144a8c;
            box-shadow: 0 3px 0 rgba(20, 74, 140, 0.35);
            animation: ms-head 4s ease-in-out infinite;
            z-index: 2;
        }

        .ms-face {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 68px;
            height: 48px;
            background: #e8ecf1;
            border: 2px solid #b6c2d1;
        }

        .ms-eye {
            position: absolute;
            top: 12px;
            width: 16px;
            height: 7px;
            background: #3ddc84;
            animation: ms-eye 4s step-end infinite;
        }

        .ms-eye-l {
            left: 10px;
        }

        .ms-eye-r {
            right: 10px;
        }

        .ms-vent {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: #2d3a4a;
        }

        /* 脸颊与颈部 */
        .ms-cheek {
            position: absolute;
            bottom: -14px;
            width: 14px;
            height: 14px;
            background: #1a5fb4;
            border: 2px solid #144a8c;
        }

        .ms-cheek-l {
            left: 4px;
        }

        .ms-cheek-r {
            right: 4px;
        }

        .ms-neck {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 26px;
            height: 14px;
            background: #144a8c;
        }

        /* 变身瞬间两侧闪光 */
        .ms-flash {
            position: absolute;
            top: 40px;
            width: 8px;
            height: 8px;
            background: #e6a817;
            opacity: 0;
            animation: ms-flash 4s step-end infinite;
        }

        .ms-flash-l {
            left: 26px;
        }

        .ms-flash-r {
            right: 26px;
        }

        /* 像素进度条 + 文案 */
        .loader-bar {
            width: 180px;
            height: 12px;
            border: 2px solid #2d3a4a;
            padding: 2px;
            background: #ffffff;
        }

        .loader-bar span {
            display: block;
            height: 100%;
            width: 0;
            background: #1a5fb4;
            animation: ms-bar 4s steps(8) infinite;
        }

        @keyframes ms-fin-l {
            0%, 12% {
                transform: rotate(78deg) translateY(-4px);
                opacity: 0.35;
            }
            38%, 100% {
                transform: rotate(30deg) translateY(0);
                opacity: 1;
            }
        }

        @keyframes ms-fin-r {
            0%, 12% {
                transform: rotate(-78deg) translateY(-4px);
                opacity: 0.35;
            }
            38%, 100% {
                transform: rotate(-30deg) translateY(0);
                opacity: 1;
            }
        }

        @keyframes ms-head {
            0%, 12% {
                transform: translateX(-50%) scaleY(0.45);
                border-color: #9aa7b8;
            }
            38%, 100% {
                transform: translateX(-50%) scaleY(1);
                border-color: #144a8c;
            }
        }

        @keyframes ms-eye {
            0%, 30% {
                opacity: 0;
                box-shadow: none;
            }
            42%, 100% {
                opacity: 1;
                box-shadow: 0 0 8px 2px rgba(61, 220, 132, 0.8);
            }
        }

        @keyframes ms-flash {
            0%, 30% {
                opacity: 0;
            }
            36%, 44% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }

        @keyframes ms-bar {
            0% {
                width: 0;
            }
            100% {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loader-scene" role="status" aria-label="Loading">
            <div class="ms-frame">
